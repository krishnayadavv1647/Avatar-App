<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Avatar Studio</title>
    <meta
      name="description"
      content="Create talking AI avatars and have real conversations with them."
    />

    <!-- Link previews (WhatsApp, Slack, LinkedIn, iMessage, X ...). Crawlers do not run
         scripts, so these must be in the HTML itself, with absolute addresses:
         %SITE_URL% is filled in at build time (see vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Avatar Studio" />
    <meta property="og:title" content="Avatar Studio" />
    <meta
      property="og:description"
      content="Create talking AI avatars and have real conversations with them."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Avatar Studio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Avatar Studio" />
    <meta
      name="twitter:description"
      content="Create talking AI avatars and have real conversations with them."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
